# Dedicated Windows x64 environment. No DX12/C++ runtime dependency on Python.
# conda env create -f tools/reconstruction/environment.yml
# The official CUDA wheel may reuse pip's HTTP cache; otherwise it is a large download.
name: image-scene-renderer
channels:
  - defaults
dependencies:
  - python=3.13.7
  - pip=25.2
  - setuptools=78.1.1
  - wheel=0.45.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu129
      - torch==2.8.0+cu129
      - torchvision==0.23.0+cu129
      # Keep these in sync with requirements.txt / requirements-moge.txt / requirements-sam2.txt / requirements-material.txt.
      - numpy==2.5.3
      - Pillow==12.3.0
      - OpenEXR==3.5.2
      - scipy==1.18.1
      - opencv-python-headless==5.0.0.93
      - huggingface-hub==0.36.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - iopath==0.1.10
      - diffusers==0.35.2
      - transformers==4.55.4
      - accelerate==1.10.1
      - safetensors==0.6.2
